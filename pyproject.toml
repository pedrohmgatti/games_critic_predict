[project]
name = "games-critic-predict"
version = "0.1.0"
description = "Previsão da nota de videogames antes do lançamento: extração e dataset"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.8", "scikit-learn>=1.5", "lightgbm>=4"]

[project.scripts]
gsp = "gsp.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
